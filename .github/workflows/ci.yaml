name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  governance:
    name: Governance and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          architecture: x64
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.6.2

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.3.1
          cache-binary: false

      - name: Verify Python tooling lock metadata, checksums, and proof
        run: python scripts/update_python_tooling_lock.py

      - name: Restore locked Python download cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-x64-py-3.14.6-${{ hashFiles('pylock.ubuntu-x86_64.toml') }}

      - name: Restore locked npm download cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-x64-node-22.23.1-npm-12.0.1-${{ hashFiles('frontend/package-lock.json') }}

      - name: Restore pre-commit cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-x64-py-3.14.6-${{ hashFiles('pylock.ubuntu-x86_64.toml', '.pre-commit-config.yaml') }}

      - name: Select exact npm
        run: npm install --global npm@12.0.1

      - name: Verify accepted runner matrix
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.14.6"
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "12.0.1"
          test "$(docker version --format '{{.Client.Version}}')" = "29.6.2"
          test "$(docker version --format '{{.Server.Version}}')" = "29.6.2"
          test "$(docker compose version --short)" = "5.3.1"

      - name: Select exact pip
        run: python -m pip install pip==26.2.1

      - name: Install locked Python environment
        run: python -m pip install --requirement pylock.ubuntu-x86_64.toml

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Validate project skills
        run: python scripts/validate_project_skills.py --root .

      - name: Run governance and documentation contracts
        run: python -m pytest tests/contracts backend/tests/contracts

      - name: Audit locked Python environment
        run: |
          python -m pip check
          python -m pip_audit --local --progress-spinner off

      - name: Run commit-time hooks
        run: python -m pre_commit run --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Run pre-push hooks
        run: python -m pre_commit run --all-files --hook-stage pre-push --show-diff-on-failure

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          architecture: x64
          check-latest: false

      - name: Verify Python tooling lock metadata, checksums, and proof
        run: python scripts/update_python_tooling_lock.py

      - name: Restore locked Python download cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-x64-py-3.14.6-${{ hashFiles('pylock.ubuntu-x86_64.toml') }}

      - name: Install locked Python environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --requirement pylock.ubuntu-x86_64.toml

      - name: Check dependencies and types
        run: |
          python -m pip check
          python -m mypy backend

      - name: Run backend tests with coverage gate
        env:
          PYTHONPATH: backend
        run: >
          python -m pytest backend/tests
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-fail-under=100

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          architecture: x64
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.6.2

      - name: Verify Python tooling lock metadata, checksums, and proof
        run: python scripts/update_python_tooling_lock.py

      - name: Restore locked Python download cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-x64-py-3.14.6-${{ hashFiles('pylock.ubuntu-x86_64.toml') }}

      - name: Restore locked npm download cache on trusted refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-x64-node-22.23.1-npm-12.0.1-${{ hashFiles('frontend/package-lock.json') }}

      - name: Select exact npm
        run: npm install --global npm@12.0.1

      - name: Install locked Python environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --requirement pylock.ubuntu-x86_64.toml

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Audit frontend production dependencies
        run: npm --prefix frontend run deps:audit

      - name: Run frontend quality gate
        env:
          OPENAPI_PYTHON: python
        run: npm --prefix frontend run check

      - name: Install accepted Playwright browser
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Run frontend smoke e2e suite
        run: npm --prefix frontend run test:e2e:ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build frontend production image for header smoke
        run: >-
          docker build
          --target production
          --build-arg VITE_API_ORIGIN=https://api.example.test
          --build-arg VITE_API_BASE_PATH=/v1
          --tag frontend-security-smoke:ci
          frontend

      - name: Inspect production frontend security headers
        run: |
          docker run --detach --rm --name frontend-security-smoke --publish 127.0.0.1:4300:3000 frontend-security-smoke:ci
          trap 'docker stop frontend-security-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:4300/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker logs frontend-security-smoke
              exit 1
            fi
            sleep 1
          done
          node frontend/scripts/security-headers-smoke.mjs http://127.0.0.1:4300 https://api.example.test
